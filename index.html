<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Infinite Tic-Tac-Toe (Touch Improved)</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;font-family:Arial, sans-serif;background:#f5f5f5}
  #topbar{height:48px;display:flex;align-items:center;padding:6px 12px;gap:12px}
  #scorebox{background:#ebebeb;padding:6px 10px;border-radius:6px;display:flex;gap:16px;align-items:center}
  #scoreX{color:#dc3737;font-weight:700}
  #scoreO{color:#2d63e0;font-weight:700}
  #newGame{padding:6px 10px;border-radius:6px;background:#e0e0e0;border:0;cursor:pointer}
  #canvasWrap{flex:1;position:relative}
  canvas{display:block;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.08);touch-action:none}
  #hint{position:absolute;left:8px;bottom:46px;color:#333;background:rgba(255,255,255,0.85);padding:6px 8px;border-radius:6px;font-size:13px}
  #turnDisplay{position:absolute;left:8px;bottom:8px;font-weight:700;padding:6px 8px;border-radius:6px}
</style>
</head>
<body>
  <div id="topbar">
    <div id="scorebox">
      <div id="scoreX">X : 0</div>
      <div id="scoreO">O : 0</div>
    </div>
    <button id="newGame">New Game</button>
    <div style="flex:1"></div>
    <div>Zoom: <span id="zoomLabel">1.00x</span></div>
  </div>

  <div id="canvasWrap">
    <canvas id="c"></canvas>
    <div id="hint">Pan: drag · Pinch to zoom · Tap = place · Tap arrow POINTER → teleport</div>
    <div id="turnDisplay"></div>
  </div>

<!-- decimal.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>

<script>
/* Touch & pointer friendly Gomoku
   Changes (summary):
   - Pointer-based input (pointerdown/move/up) to unify mouse & touch
   - Single-finger drag to pan (mobile), two-finger pinch to zoom
   - Tap to place piece (short press without dragging)
   - Ghost (semi-transparent) X/O drawn on hover/touch cell
   - Arrow hit testing supports taps on mobile
   - touch-action:none on canvas to enable custom gestures
*/

// ---------- Config ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let WIDTH = window.innerWidth;
let HEIGHT = window.innerHeight - document.getElementById('topbar').offsetHeight;
canvas.width = WIDTH;
canvas.height = HEIGHT;

const CELL_BASE = 48;            // base pixel per cell at zoom 1
let ZOOM = new Decimal(1);       // Decimal
const ZOOM_MIN = new Decimal(0.1);
const ZOOM_MAX = new Decimal(5);

const ARROW_MIN = 10;
const ARROW_MAX = 150;
const ARROW_SCALE_DIST = 20.0;

const COLORS = {
  grid: '#c8c8c8',
  bg: '#ffffff',
  X: '#dc3737',
  O: '#2d63e0',
  hover: '#50c970',
  hoverGhost: 'rgba(80,201,112,0.35)',
  win: '#0aa050',
  uiBg: '#ebebeb'
};

// ---------- Game state ----------
let board = new Map(); // key "gx,gy" -> 'X'/'O'
let starter = 'X';
let current = starter;
let last_winner = null;
let score = { X: 0, O: 0 };

let camera_x = new Decimal(WIDTH / 2);   // pixel of grid origin (top-left of cell (0,0))
let camera_y = new Decimal(HEIGHT / 2);

let winner_line = [];  // [ {gx,gy}, {gx,gy} ] endpoints
let game_over = false;

let arrow_hit_map = new Map(); // key "gx,gy" -> {x,y,r}

// pointer tracking for touch/mouse
const pointers = new Map(); // pointerId -> {x,y}
let lastTapInfo = null; // {time, x, y, gx, gy}
let pinchStart = null; // {dist, zoom, centerX, centerY}
let isPanning = false;
let panStart = null; // {x,y, camera_x, camera_y}
let hoverCell = null; // {gx,gy}
let ghostAlpha = 0.45; // transparency for ghost piece

// DOM elements
const scoreXEl = document.getElementById('scoreX');
const scoreOEl = document.getElementById('scoreO');
const newGameBtn = document.getElementById('newGame');
const zoomLabel = document.getElementById('zoomLabel');
const turnDisplay = document.getElementById('turnDisplay');

Decimal.set({ toExpNeg: -9e15, toExpPos: 9e15 });

// ---------- Helpers ----------
function cellSize() { return ZOOM.mul(CELL_BASE); }
function gridKey(gx, gy){ return gx + ',' + gy; }

function gridToScreenTopLeftDec(gx, gy){
  const s = cellSize();
  const x = new Decimal(gx).mul(s).plus(camera_x);
  const y = new Decimal(gy).mul(s).plus(camera_y);
  return {x, y};
}
function gridToScreenCenterDec(gx, gy){
  const tl = gridToScreenTopLeftDec(gx, gy);
  const s = cellSize();
  return { x: tl.x.plus(s.div(2)), y: tl.y.plus(s.div(2)) };
}
function screenToGridDec(mx, my){
  const s = cellSize();
  const gx = Decimal.floor(new Decimal(mx).minus(camera_x).div(s));
  const gy = Decimal.floor(new Decimal(my).minus(camera_y).div(s));
  return { gx: gx.toNumber(), gy: gy.toNumber() };
}

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function toNum(dec){ if (Decimal.isDecimal(dec)) return Number(dec.toFixed(8)); return Number(new Decimal(dec).toFixed(8)); }

// ---------- Win detection (unchanged) ----------
const directions = [[1,0],[0,1],[1,1],[1,-1]];
function checkWinAndLine(gx, gy, player){
  for (let d=0; d<directions.length; d++){
    const [dx,dy] = directions[d];
    let line = [[gx,gy]];
    let cx = gx+dx, cy = gy+dy;
    while(board.get(gridKey(cx,cy)) === player){ line.push([cx,cy]); cx += dx; cy += dy; }
    cx = gx-dx; cy = gy-dy;
    while(board.get(gridKey(cx,cy)) === player){ line.push([cx,cy]); cx -= dx; cy -= dy; }
    if (line.length >= 5){
      line.sort((a,b) => (a[0]*dx + a[1]*dy) - (b[0]*dx + b[1]*dy));
      winner_line = [ {gx: line[0][0], gy: line[0][1]}, {gx: line[line.length-1][0], gy: line[line.length-1][1]} ];
      return true;
    }
  }
  return false;
}

// ---------- Drawing ----------
function drawGrid(){
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0,0,WIDTH,HEIGHT);
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;

  const sDec = cellSize();
  const s = toNum(sDec);

  const gx0 = Math.floor( toNum( Decimal.floor( new Decimal(-camera_x).minus(sDec).div(sDec) ) ) ) - 1;
  const gx1 = Math.floor( toNum( Decimal.floor( new Decimal(WIDTH).minus(camera_x).div(sDec) ) ) ) + 1;
  const gy0 = Math.floor( toNum( Decimal.floor( new Decimal(-camera_y).minus(sDec).div(sDec) ) ) ) - 1;
  const gy1 = Math.floor( toNum( Decimal.floor( new Decimal(HEIGHT).minus(camera_y).div(sDec) ) ) ) + 1;

  ctx.beginPath();
  for (let gx = gx0; gx <= gx1; gx++){
    const x = toNum( new Decimal(gx).mul(sDec).plus(camera_x) );
    ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT);
  }
  for (let gy = gy0; gy <= gy1; gy++){
    const y = toNum( new Decimal(gy).mul(sDec).plus(camera_y) );
    ctx.moveTo(0, y); ctx.lineTo(WIDTH, y);
  }
  ctx.stroke();
}

function drawPieces(){
  const s = toNum(cellSize());
  for (const [key, p] of board.entries()){
    const [gx,gy] = key.split(',').map(Number);
    const center = gridToScreenCenterDec(gx, gy);
    const cx = toNum(center.x), cy = toNum(center.y);
    if (cx < -2000 || cx > WIDTH + 2000 || cy < -2000 || cy > HEIGHT + 2000) continue;

    if (p === 'X'){
      ctx.strokeStyle = COLORS.X;
      ctx.lineWidth = Math.max(1, Math.round(3 * toNum(ZOOM)));
      const half = Math.max(6, (s/2) * 0.45);
      ctx.beginPath();
      ctx.moveTo(cx - half, cy - half);
      ctx.lineTo(cx + half, cy + half);
      ctx.moveTo(cx - half, cy + half);
      ctx.lineTo(cx + half, cy - half);
      ctx.stroke();
    } else {
      ctx.strokeStyle = COLORS.O;
      ctx.lineWidth = Math.max(1, Math.round(3 * toNum(ZOOM)));
      const radius = Math.max(4, Math.round((s/2) * 0.45));
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI*2);
      ctx.stroke();
    }
  }
}

function drawHover(mx, my){
  if (game_over) return;
  if (!hoverCell) return;
  const {gx,gy} = hoverCell;
  const tl = gridToScreenTopLeftDec(gx, gy);
  const x = toNum(tl.x), y = toNum(tl.y);
  const s = toNum(cellSize());
  // outline
  ctx.strokeStyle = COLORS.hover;
  ctx.lineWidth = Math.max(1, Math.round(2 * toNum(ZOOM)));
  ctx.strokeRect(x+1, y+1, s-2, s-2);

  // ghost piece (semi-transparent X or O) if empty
  if (!board.has(gridKey(gx,gy))){
    const center = gridToScreenCenterDec(gx, gy);
    const cx = toNum(center.x), cy = toNum(center.y);
    ctx.save();
    ctx.globalAlpha = ghostAlpha;
    if (current === 'X'){
      ctx.strokeStyle = COLORS.X;
      ctx.lineWidth = Math.max(1, Math.round(3 * toNum(ZOOM)));
      const half = Math.max(6, (s/2) * 0.45);
      ctx.beginPath();
      ctx.moveTo(cx - half, cy - half);
      ctx.lineTo(cx + half, cy + half);
      ctx.moveTo(cx - half, cy + half);
      ctx.lineTo(cx + half, cy - half);
      ctx.stroke();
    } else {
      ctx.strokeStyle = COLORS.O;
      ctx.lineWidth = Math.max(1, Math.round(3 * toNum(ZOOM)));
      const radius = Math.max(4, Math.round((s/2) * 0.45));
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawWinnerLine(){
  if (!winner_line || winner_line.length < 2) return;
  const p1 = gridToScreenCenterDec(winner_line[0].gx, winner_line[0].gy);
  const p2 = gridToScreenCenterDec(winner_line[1].gx, winner_line[1].gy);
  const x1 = toNum(p1.x), y1 = toNum(p1.y);
  const x2 = toNum(p2.x), y2 = toNum(p2.y);
  ctx.strokeStyle = COLORS.win;
  ctx.lineWidth = Math.max(3, Math.round(6 * toNum(ZOOM)));
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function computeAndDrawArrows(){
  arrow_hit_map.clear();
  const cx = WIDTH/2, cy = HEIGHT/2;
  const s = toNum(cellSize());
  for (const [key, player] of board.entries()){
    const [gx,gy] = key.split(',').map(Number);
    const center = gridToScreenCenterDec(gx, gy);
    const px = toNum(center.x), py = toNum(center.y);
    if (px >= 0 && px <= WIDTH && py >= 0 && py <= HEIGHT) continue; // visible
    const dx = px - cx, dy = py - cy;
    const dist = Math.hypot(dx, dy);
    if (dist === 0) continue;
    const angle = Math.atan2(dy, dx);
    let tCandidates = [];
    if (dx !== 0){
      let t = (0 - cx) / dx; if (t>0) tCandidates.push(t);
      t = (WIDTH - cx) / dx; if (t>0) tCandidates.push(t);
    }
    if (dy !== 0){
      let t = (0 - cy) / dy; if (t>0) tCandidates.push(t);
      t = (HEIGHT - cy) / dy; if (t>0) tCandidates.push(t);
    }
    if (tCandidates.length === 0) continue;
    const tmin = Math.min(...tCandidates);
    const ex = cx + dx * tmin;
    const ey = cy + dy * tmin;
    const cellDist = dist / Math.max(1.0, s);
    let size = ARROW_MAX * (1.0 / (1.0 + (cellDist / ARROW_SCALE_DIST)));
    size = clamp(size, ARROW_MIN, ARROW_MAX);
    const tip = {x: ex, y: ey};
    const left = {x: ex - size * Math.cos(angle - 0.35), y: ey - size * Math.sin(angle - 0.35)};
    const right = {x: ex - size * Math.cos(angle + 0.35), y: ey - size * Math.sin(angle + 0.35)};
    ctx.fillStyle = (player === 'X') ? COLORS.X : COLORS.O;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(left.x, left.y);
    ctx.lineTo(right.x, right.y);
    ctx.closePath();
    ctx.fill();
    const hitRadius = Math.max(18, Math.round(size * 0.55)); // bigger on touch
    arrow_hit_map.set(key, {x: tip.x, y: tip.y, r: hitRadius});
  }
}

// ---------- UI updates ----------
function updateUI(){
  scoreXEl.textContent = `X : ${score.X}`;
  scoreOEl.textContent = `O : ${score.O}`;
  zoomLabel.textContent = `${toNum(ZOOM).toFixed(2)}x`;
  turnDisplay.style.background = 'rgba(255,255,255,0.9)';
  turnDisplay.style.color = (current === 'X') ? COLORS.X : COLORS.O;
  turnDisplay.style.padding = '6px 8px';
  turnDisplay.style.borderRadius = '6px';
  turnDisplay.textContent = `${current} turns`;
}

// ---------- New game ----------
function newGame(byWin=null){
  board.clear();
  winner_line = [];
  game_over = false;
  if (byWin === 'X' || byWin === 'O'){
    const loser = (byWin === 'X') ? 'O' : 'X';
    starter = loser;
    last_winner = byWin;
  } else { last_winner = null; }
  current = starter;
}

// ---------- Input handling (pointer & touch friendly) ----------
canvas.addEventListener('contextmenu', e => { e.preventDefault(); }); // disable context menu

function getCanvasPos(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  const pos = getCanvasPos(e.clientX, e.clientY);
  pointers.set(e.pointerId, pos);

  if (pointers.size === 1){
    // potential tap or pan start
    isPanning = true;
    panStart = { x: pos.x, y: pos.y, camera_x: camera_x, camera_y: camera_y };
  } else if (pointers.size === 2){
    // start pinch
    const ids = Array.from(pointers.keys());
    const a = pointers.get(ids[0]);
    const b = pointers.get(ids[1]);
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const centerX = (a.x + b.x) / 2, centerY = (a.y + b.y) / 2;
    pinchStart = { dist, zoom: ZOOM, centerX, centerY };
    isPanning = false; // pinch overrides single-finger pan
  }

  // update hover cell immediately
  hoverFromPos(pos.x, pos.y);
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const pos = getCanvasPos(e.clientX, e.clientY);
  pointers.set(e.pointerId, pos);

  if (pointers.size === 1 && isPanning && panStart){
    const dx = pos.x - panStart.x;
    const dy = pos.y - panStart.y;
    // if user moved, update camera
    camera_x = panStart.camera_x.plus(dx);
    camera_y = panStart.camera_y.plus(dy);
  } else if (pointers.size === 2 && pinchStart){
    const ids = Array.from(pointers.keys());
    const a = pointers.get(ids[0]);
    const b = pointers.get(ids[1]);
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    // compute new zoom factor about midpoint
    const centerX = (a.x + b.x) / 2, centerY = (a.y + b.y) / 2;
    const scale = dist / pinchStart.dist;
    const oldZoom = ZOOM;
    ZOOM = Decimal.max(ZOOM_MIN, Decimal.min(ZOOM_MAX, pinchStart.zoom.mul(scale)));
    // keep center point stable
    camera_x = new Decimal(centerX).minus( new Decimal(centerX).minus(camera_x).div(oldZoom).mul(ZOOM) );
    camera_y = new Decimal(centerY).minus( new Decimal(centerY).minus(camera_y).div(oldZoom).mul(ZOOM) );
  } else if (pointers.size === 1){
    // update hover
    hoverFromPos(pos.x, pos.y);
  }
});

canvas.addEventListener('pointerup', (e) => {
  canvas.releasePointerCapture(e.pointerId);
  if (!pointers.has(e.pointerId)) return;
  const pos = pointers.get(e.pointerId);
  // handle tap: if small movement since pointerdown and short time, treat as tap
  // We'll consider it a tap if movement small (<=8px) and no pinch occurred
  let treatedAsTap = false;
  if (!pinchStart){
    if (panStart){
      const dx = pos.x - panStart.x; const dy = pos.y - panStart.y;
      const moved = Math.hypot(dx, dy);
      if (moved <= 8){
        // may be tap — check arrow hit first
        const arrowKey = hitTestArrows(pos.x, pos.y);
        if (arrowKey){
          // teleport to arrow target
          const [gx,gy] = arrowKey.split(',').map(Number);
          const s = cellSize();
          camera_x = new Decimal(WIDTH/2).minus( new Decimal(gx).mul(s).plus(s.div(2)) );
          camera_y = new Decimal(HEIGHT/2).minus( new Decimal(gy).mul(s).plus(s.div(2)) );
          treatedAsTap = true;
        } else {
          // place piece
          if (!game_over){
            const { gx, gy } = screenToGridDec(pos.x, pos.y);
            if (!board.has(gridKey(gx,gy))){
              board.set(gridKey(gx,gy), current);
              if (checkWinAndLine(gx, gy, current)){
                score[current] += 1;
                game_over = true;
                const loser = (current === 'X') ? 'O' : 'X';
                starter = loser; last_winner = current;
              }
              if (!game_over) current = (current === 'X') ? 'O' : 'X';
            }
          }
          treatedAsTap = true;
        }
      }
    }
  }

  // clean up pointer
  pointers.delete(e.pointerId);
  if (pointers.size < 2){ pinchStart = null; }
  if (pointers.size === 0){ isPanning = false; panStart = null; }

  // update hover
  if (pointers.size === 0){ hoverCell = null; }

});

canvas.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); pinchStart=null; isPanning=false; panStart=null; hoverCell=null; });

// mouse wheel zoom (desktop)
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = -Math.sign(e.deltaY);
  const factor = 1 + 0.12 * delta;
  const oldZoom = ZOOM;
  ZOOM = Decimal.max(ZOOM_MIN, Decimal.min(ZOOM_MAX, ZOOM.mul(factor)));
  camera_x = new Decimal(mx).minus( new Decimal(mx).minus(camera_x).div(oldZoom).mul(ZOOM) );
  camera_y = new Decimal(my).minus( new Decimal(my).minus(camera_y).div(oldZoom).mul(ZOOM) );
  updateUI();
}, { passive: false });

// helper: compute hover cell from canvas pos
function hoverFromPos(x, y){
  const { gx, gy } = screenToGridDec(x, y);
  hoverCell = { gx, gy };
}

function hitTestArrows(mx, my){
  for (const [key, val] of arrow_hit_map.entries()){
    const dx = mx - val.x, dy = my - val.y;
    if (dx*dx + dy*dy <= val.r * val.r) return key;
  }
  return null;
}

newGameBtn.addEventListener('click', ()=> newGame(null));

// handle resize
window.addEventListener('resize', ()=>{
  WIDTH = window.innerWidth;
  HEIGHT = window.innerHeight - document.getElementById('topbar').offsetHeight;
  canvas.width = WIDTH;
  canvas.height = HEIGHT;
  updateUI();
});

// ---------- Main render loop ----------
function loop(){
  drawGrid();
  drawPieces();
  // draw hover / ghost if pointer present or mouse hovering
  drawHover(canvas._mouseX || (pointers.size ? Array.from(pointers.values())[0].x : 0), canvas._mouseY || (pointers.size ? Array.from(pointers.values())[0].y : 0));
  drawWinnerLine();
  computeAndDrawArrows();
  updateUI();
  requestAnimationFrame(loop);
}

// track mouse position for desktop hover
canvas.addEventListener('mousemove', (e)=> {
  const rect = canvas.getBoundingClientRect();
  canvas._mouseX = e.clientX - rect.left;
  canvas._mouseY = e.clientY - rect.top;
  hoverFromPos(canvas._mouseX, canvas._mouseY);
});

updateUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
